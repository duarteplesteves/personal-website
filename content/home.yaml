title: Duarte Esteves

introduction:
  en: >-
    I build software to explore ideas, understand problems, and turn possible
    solutions into useful things while continuing to learn. Reading gives that
    curiosity another place to grow, bringing new perspectives to how I think
    about the things I make.
  pt: >-
    Crio software para explorar ideias, compreender problemas e transformar
    possíveis soluções em coisas úteis, enquanto continuo a aprender. A leitura
    dá a essa curiosidade outro espaço para crescer e traz novas perspetivas à
    forma como penso sobre aquilo que faço.

description:
  en: Duarte Esteves explores software, ideas, learning, and reading.
  pt: Duarte Esteves explora software, ideias, aprendizagem e leitura.

