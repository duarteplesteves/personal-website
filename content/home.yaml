title: Duarte Esteves

introduction:
  en: >-
    I build software to explore ideas, solve useful problems, and keep learning.
    Reading gives that curiosity another place to grow and often changes how I
    approach the things I make.
  pt: >-
    Crio software para explorar ideias, resolver problemas úteis e continuar a
    aprender. A leitura dá a essa curiosidade outro espaço para crescer e muda
    frequentemente a forma como abordo aquilo que faço.

description:
  en: Duarte Esteves explores software, ideas, learning, and reading.
  pt: Duarte Esteves explora software, ideias, aprendizagem e leitura.
