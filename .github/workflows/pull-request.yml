name: Pull request

on:
  pull_request:

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - run: nub ci
      - run: nub run check
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: dist
          if-no-files-found: error

  preview:
    name: Cloudflare preview
    needs: required-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - run: nub ci
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: dist
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          nub exec wrangler pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'personal-website' }} --branch=pr-${{ github.event.pull_request.number }}
          jq -r 'select(.type == "pages-deploy-detailed") | "pages-deployment-id=\(.deployment_id)", "deployment-url=\(.url)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify preview responses
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --head "$PREVIEW_URL" | tr -d '\r' > headers
          grep -Fqix 'cache-control: public, max-age=0, must-revalidate' headers
          grep -Fqix 'permissions-policy: camera=(), geolocation=(), microphone=()' headers
          grep -Fqix 'referrer-policy: strict-origin-when-cross-origin' headers
          grep -Fqix 'x-content-type-options: nosniff' headers
          grep -Fqix 'x-frame-options: DENY' headers
          grep -Fqix 'x-robots-tag: noindex' headers
          curl --fail --silent --show-error --retry 5 --retry-all-errors --head "$PREVIEW_URL/assets/library.js" | tr -d '\r' > asset-headers
          grep -Fqix 'cache-control: public, max-age=86400' asset-headers
