name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_deployment_id:
        description: Existing Cloudflare Pages deployment ID to promote
        required: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm install --global @nubjs/nub@0.7.5
      - run: nub ci
      - run: nub run validate
      - run: nub run typecheck
      - run: nub run lint
      - run: nub run format:check
      - run: nub run test
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'personal-website' }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for production deployment
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'personal-website' }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          test -n "$DEPLOYMENT_ID"
          for _ in {1..12}; do
            if response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT"); then
              canonical_deployment_id=$(jq -r '.result.canonical_deployment.id // empty' <<< "$response")
              test "$canonical_deployment_id" = "$DEPLOYMENT_ID" && exit 0
            fi
            sleep 5
          done
          echo "Deployment $DEPLOYMENT_ID did not become canonical." >&2
          exit 1
      - name: Verify production responses
        run: |
          for _ in {1..12}; do
            if curl --fail --silent --show-error --head https://duarteesteves.com/ | tr -d '\r' > headers &&
              grep -Fqix 'referrer-policy: strict-origin-when-cross-origin' headers &&
              grep -Fqix 'x-content-type-options: nosniff' headers &&
              grep -Fqix 'cache-control: public, max-age=0, must-revalidate' headers &&
              curl --fail --silent --show-error --head https://duarteesteves.com/assets/library.js | tr -d '\r' > asset-headers &&
              grep -Fqix 'cache-control: public, max-age=86400' asset-headers &&
              curl --fail --silent --show-error --head https://www.duarteesteves.com/ | tr -d '\r' > redirect-headers &&
              grep -Fqix 'location: https://duarteesteves.com/' redirect-headers; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Measure launch quality
        run: |
          mkdir lighthouse
          for page in home library; do
            path=en/
            if test "$page" = library; then path=en/library/; fi
            nubx -q -y lighthouse@13.0.3 "https://duarteesteves.com/$path" --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,seo,best-practices --output=json --output-path="lighthouse/$page.json"
            jq -e '.audits["largest-contentful-paint"].numericValue <= 2500 and .audits["cumulative-layout-shift"].numericValue <= 0.1 and .audits["total-blocking-time"].numericValue <= 200 and .categories.accessibility.score == 1' "lighthouse/$page.json" > /dev/null
          done
          {
            echo '### Lighthouse lab results'
            echo '| Page | LCP | CLS | TBT | Requests | Shipped JS |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: |'
            for page in home library; do
              jq -r --arg page "$page" '[$page, .audits["largest-contentful-paint"].displayValue, .audits["cumulative-layout-shift"].displayValue, .audits["total-blocking-time"].displayValue, (.audits["network-requests"].details.items | length | tostring), ([.audits["network-requests"].details.items[] | select(.resourceType == "Script") | .transferSize] | add // 0 | tostring) + " B"] | "| " + join(" | ") + " |"' "lighthouse/$page.json"
            done
            echo
            echo 'INP needs field data; TBT is the launch lab responsiveness guard.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production
          path: lighthouse
          if-no-files-found: error

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Promote existing deployment without rebuilding
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'personal-website' }}
          DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
        run: |
          response=$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEPLOYMENT_ID/rollback")
          test "$(jq -r '.result.id // empty' <<< "$response")" = "$DEPLOYMENT_ID"
          for _ in {1..12}; do
            if response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT"); then
              canonical_deployment_id=$(jq -r '.result.canonical_deployment.id // empty' <<< "$response")
              test "$canonical_deployment_id" = "$DEPLOYMENT_ID" && break
            fi
            sleep 5
          done
          test "$canonical_deployment_id" = "$DEPLOYMENT_ID"
          echo "Promoted existing deployment \`$DEPLOYMENT_ID\` without rebuilding." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify rollback
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors https://duarteesteves.com/ > /dev/null
